<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente de fundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Gradiente do F e da borda -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#47baf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Brilho suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#47baf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo com borda arredondada e contorno sutil -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(71, 186, 248, 0.3)" stroke-width="8" />

  <!-- Letra F estilizada e com corte moderno -->
  <path 
    d="M 160 120 
       L 352 120 
       A 20 20 0 0 1 372 140 
       L 372 176 
       A 20 20 0 0 1 352 196 
       L 236 196 
       L 236 236 
       L 324 236 
       A 20 20 0 0 1 344 256 
       L 344 292 
       A 20 20 0 0 1 324 312 
       L 236 312 
       L 236 372 
       A 20 20 0 0 1 216 392 
       L 180 392 
       A 20 20 0 0 1 160 372 
       Z" 
    fill="url(#accentGrad)" 
    filter="url(#glow)"
  />
</svg>
